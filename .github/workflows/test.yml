# PR と main への push で、判定ロジックのテストと self-test を走らせる
# 秘密の値は使わない。外からの PR でも読み取りの権限だけで動く
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run self-test
